# RedApeAI backend on Render.
#
#   Dashboard → Blueprints → New Blueprint Instance → this repo
#
# The dashboard SPA is deliberately NOT in here. apps/web deploys on Vercel and
# rewrites /api/* to redape-api, which is what keeps the session cookie
# first-party for Better Auth's OAuth callbacks. See apps/web/vercel.json.
#
# Everything marked `sync: false` is prompted for on apply and then lives in the
# dashboard — nothing secret belongs in this file.
#
# ---------------------------------------------------------------------------
# CURRENTLY CONFIGURED FOR A NO-CARD DEMO DEPLOY. Read this before applying.
#
# Render's private services have no free tier at all — a paid plan is required
# to create one regardless of Blueprint vs. manual creation. To deploy without
# a payment method, redape-orchestrator below is a FREE web service instead of
# the private service it's designed to be, and the two backend services talk
# over their public onrender.com URLs instead of the private network (a free
# web service can SEND private-network traffic but cannot RECEIVE it, so even
# a private redape-api couldn't be called by a free orchestrator).
#
# Two consequences, accepted knowingly for this mode, not silently:
#   - The orchestrator is reachable by anyone who finds its URL. It has ZERO
#     request-level auth today — every route trusts tenant_id/user_id as given
#     — because the design relies entirely on network isolation. This is a
#     real exposure, not a theoretical one. Do not point real users at this
#     configuration.
#   - Free services spin down after 15 min idle; a cold start (~30-60s) can
#     eat into the 75s Operator command budget and may cost a request outright.
#
# To harden once you have a card: flip redape-orchestrator back to
# `type: pserv`, change both plans off `free`, switch ORCHESTRATOR_URL and
# BFF_BASE_URL back to `fromService` (see git history on this file — that's
# exactly what they were before), and add request auth to the orchestrator
# before removing the network isolation is safe to rely on again.
# ---------------------------------------------------------------------------

envVarGroups:
  # One generated value delivered to both services. The BFF compares it with
  # timingSafeEqual, so a mismatch makes every outbound email 401 with no other
  # symptom; generating it once in a shared group is what makes that class of
  # bug impossible rather than merely unlikely.
  - name: redape-shared
    envVars:
      - key: OUTBOUND_WEBHOOK_SECRET
        generateValue: true

services:
  # ---------------------------------------------------------------------------
  # The BFF. The only service reachable from the internet.
  # ---------------------------------------------------------------------------
  - type: web
    name: redape-api
    runtime: docker
    # Same region for every service: Render's private network does not cross
    # regions. Virginia is also nearest to Bedrock us-east-1.
    region: virginia
    # `free` for the no-card path — see the block at the top of this file. In
    # the hardened setup this must NOT be free: a free web service can't
    # receive private-network traffic, and this one has to answer the
    # orchestrator's MCP tool discovery.
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    # The pnpm workspace, not apps/api — the image resolves @repo/db-sql through
    # the root lockfile.
    dockerContext: .
    healthCheckPath: /healthz
    # Wait for CI. The migration job runs there, so this ordering is what keeps
    # Neon ahead of the code that expects it.
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: redape-shared

      - key: NODE_ENV
        value: production
      # Declared rather than left to Render so the port the container binds and
      # the port `hostport` advertises to the orchestrator cannot disagree.
      - key: PORT
        value: 4000

      # Manual, not `fromService`: with the orchestrator on a free plan (see
      # the top of this file) it has no private hostname to template — Render
      # doesn't expose a sibling service's PUBLIC url through `fromService`
      # (only host/port/hostport/connectionString, all private-network-only).
      # Deploy redape-orchestrator first, copy its onrender.com URL from the
      # dashboard, paste it here. lib/env.ts accepts either a bare host:port
      # or a full URL, so pasting the https:// form works as-is.
      - key: ORCHESTRATOR_URL
        sync: false

      # These two must be the origin the BROWSER uses — the Vercel domain, not
      # this service's onrender.com URL. Prompted rather than hardcoded because
      # getting them wrong breaks sign-in silently, and a wrong value committed
      # to git is worse than one that had to be typed.
      - key: BETTER_AUTH_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false

      - key: COOKIE_CROSS_SITE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: KNOWLEDGE_COLLECTION
        value: redape_re

      # Render generates a 256-bit value; lib/env.ts requires at least 32 chars.
      - key: BETTER_AUTH_SECRET
        generateValue: true

      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ZERNIO_API_KEY
        sync: false
      - key: ZERNIO_WEBHOOK_SECRET
        sync: false
      - key: ZERNIO_WEBHOOK_PUBLIC_URL
        sync: false
      - key: ZERNIO_CONNECT_REDIRECT_URL
        sync: false

  # ---------------------------------------------------------------------------
  # The agent runtime.
  #
  # DESIGNED as a private service with no public address — see the top of this
  # file for why it's a free `web` service instead right now, and what that
  # costs. When hardened back to `pserv`: it receives traffic (the BFF proxies
  # every turn to it) and must stay running BETWEEN requests, not just during
  # them — engine/background.py sends the outbound mail, writes the trace and
  # publishes events AFTER the response has gone out, and the lifespan hook
  # replays turns whose deferred work never ran. None of that changes here;
  # only reachability does.
  # ---------------------------------------------------------------------------
  - type: web
    name: redape-orchestrator
    runtime: docker
    region: virginia
    # `free` for the no-card path. In the hardened setup this is a paid `pserv`
    # sized 1c-2g: fastembed runs an ONNX session in-process and LangGraph
    # holds the whole turn state, and 512 MB is not enough once a document is
    # being chunked. The free plan's 512 MB ceiling is workable for a demo
    # only because nobody is uploading documents concurrently.
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./apps/worker/orchestrator/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: redape-shared

      # Matches the port uvicorn binds in the Dockerfile's CMD.
      - key: PORT
        value: 8000

      # Manual, mirroring ORCHESTRATOR_URL on redape-api — see the note there.
      # Paste redape-api's onrender.com URL once it exists.
      - key: BFF_BASE_URL
        sync: false

      - key: DRAGONFLY_URL
        fromService:
          type: keyvalue
          name: redape-cache
          property: connectionString

      # OUTBOUND_WEBHOOK_URL is deliberately absent. config.py derives it from
      # BFF_BASE_URL, the same way the MCP and directory endpoints already are.
      # Setting it here would pin a generated hostname in a second place, free
      # to drift from the first.

      # Empty, and it must be JSON — config.py types this `list[str]`, so a
      # comma-separated string raises at startup. This governs browser CORS
      # preflight only — it does not, and cannot, stop a direct non-browser
      # call to this service now that it's publicly reachable. See the note
      # at the top of this file: that gap needs a real fix before real users.
      - key: CORS_ORIGINS
        value: "[]"

      - key: LLM_BACKEND
        value: bedrock
      - key: BEDROCK_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: minimax.minimax-m2
      - key: LLM_MAX_OUTPUT_TOKENS
        value: 4096

      # Each budget sits inside its caller's: this call < a node < the whole
      # command (75s) < the BFF's fetch (85s) < the browser (95s). Raising one
      # without raising those outside it means the outer hop abandons work the
      # inner one is still doing.
      - key: LLM_TIMEOUT_SECONDS
        value: 60

      # Where the Dockerfile baked BAAI/bge-small-en-v1.5. Without this,
      # fastembed re-downloads ~130 MB into a temp directory on first use.
      - key: FASTEMBED_CACHE_PATH
        value: /opt/fastembed

      - key: MONGO_DB
        value: redape
      - key: MONGO_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      # NOT REDAPE_QDRANT — that name is not a recognised setting and is
      # silently ignored. This is the one config.py reads.
      - key: QDRANT_API_KEY
        sync: false
      - key: BEDROCK_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # The event bus, replacing the Dragonfly container from docker-compose.
  # Valkey 8 speaks the same protocol, and the orchestrator only ever uses
  # PUBLISH/SUBSCRIBE plus a 60s-TTL cache — nothing that needs Dragonfly
  # specifically, and nothing worth self-hosting.
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: redape-cache
    region: virginia
    # `free` works fine here unlike the two services above: free Key Value has
    # no private-network restriction (it's a datastore, not compute) and no
    # persistence — irrelevant to us, since everything stored here is already
    # meant to be disposable (see below). Move to a paid plan only if traffic
    # ever needs more than the free connection ceiling.
    plan: free
    # Internal connections only.
    ipAllowList: []
    # Everything stored here is disposable: stores/events.py is pure pub/sub and
    # keeps no keys at all, and mcp/cache.py's entries carry a 60s TTL and are
    # rebuilt by one round trip on a miss.
    maxmemoryPolicy: allkeys-lru
